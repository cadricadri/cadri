# Self-hosted Cadri: engine + webui on one machine.
#
#   ./scripts/run-with-docker
#
# The script creates docker/.env on first run, starts these services, and
# prints http://127.0.0.1:8080 plus the API token. Point the Claude Code
# plugin at it with CADRI_URL=http://127.0.0.1:8080 and the same token.
name: cadri
services:
  engine:
    build:
      context: ../engine
      args:
        EDITION: core
    environment:
      CADRI_API_TOKEN: ${CADRI_API_TOKEN:?set CADRI_API_TOKEN in docker/.env}
    volumes:
      - cadri-data:/data
    restart: unless-stopped

  webui:
    build:
      context: ../webui
    environment:
      CADRI_ENGINE_UPSTREAM: http://engine:8080
    ports:
      - "8080:8080"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  cadri-data:
