name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run build

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s plugin/tests -v

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: engine-core
            context: engine
            build_args: EDITION=core
          - name: engine-ee
            context: engine
            build_args: EDITION=ee
          - name: webui
            context: webui
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  dispatch-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [engine, webui, plugin, images]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hosted deploy
        env:
          TOKEN: ${{ secrets.CADRI_CLOUD_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CADRI_CLOUD_DISPATCH_TOKEN is not set; skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cadricadri/cadri-cloud/dispatches \
            -d "{\"event_type\":\"cadri-main\",\"client_payload\":{\"sha\":\"$SHA\"}}"
          echo "Dispatched deploy of $SHA to cadricadri/cadri-cloud."
